# Global percentage ranges for passive decay and direct player attributes.
# Each category must cover 0 through 100 without gaps or overlaps.
# A range includes its minimum and excludes its maximum, except the range ending at 100.
# Attribute and health regeneration modifiers are relative: -0.10 is -10%, and 0.20 is +20%.

settings:
  enabled: true
  update-interval-ticks: 20
  attribute-modifier-limits:
    minimum: -0.95
    maximum: 1.0

fullness-effects:
  extremely-starving:
    minimum-percentage: 0
    maximum-percentage: 10
    decay-multiplier: 1.0
    health-regeneration-modifier: -0.90
    attributes:
      movement-speed: -0.10
      block-break-speed: -0.91
      attack-damage: -0.20

  starving:
    minimum-percentage: 10
    maximum-percentage: 20
    decay-multiplier: 1.0
