# HungerOverhaul food settings.
# The foods section accepts vanilla Minecraft material IDs and CraftEngine item IDs.
# nutrition and fullness accept positive, zero, or negative finite numbers.
# eating-time-ticks optionally replaces the item's native duration before the group speed multiplier.
# cooldown-ticks and overflow-policy optionally override config.yml for one food.
# overflow-policy accepts deny or clamp and checks both nutrition and fullness.
# interrupt may optionally override on-damage, on-move, and on-sneak-toggle for one food.
# Missing interruption values use the defaults under eating.interrupt in config.yml.
# Switching items or releasing the use key always ends native item use and is not configurable.
# Unlisted edible items use fallback when it is enabled.
# Potions and milk are not handled by fallback.
# The minecraft:cake values below are applied to each individual slice.
# post-consume is optional on fallback, foods entries, and custom-foods entries.
# Missing post-consume means no extra actions. These settings are not inherited from fallback.
# Actions run once on the next server tick after successful consumption, including cake slices.
# Effects run first, then commands in list order. Offline/dead players skip remaining actions.
# A completed consumption uses its original action list even if a reload happens before execution.
# Example to copy under one food (all examples below are disabled):
#   post-consume:
#     effects:
#       - type: minecraft:regeneration  # The minecraft: prefix can be omitted.
#         duration: 100                 # Positive ticks; 20 ticks = 1 second.
#         amplifier: 0                  # 0 = level I, 1 = level II; allowed range 0..255.
#         ambient: false                # Optional, default false.
#         particles: true               # Optional, default true.
#         icon: true                    # Optional, default true.
#     commands:
#       - "say {player} ate {food}"      # Plain text runs as console, as in the legacy plugin.
#       - sender: player               # console or player; player does not gain permissions.
#         command: "help"
# Placeholders: {player}, {player_uuid}, {food} (matched rule ID, or fallback).
# A single leading / is optional. PlaceholderAPI placeholders are not expanded here.
# Only add trusted commands: console commands run with console permissions.
# Commands can integrate other plugins without adding their APIs as dependencies.
# Native food effects remain enabled; added effects use the normal Minecraft merging rules.

fallback:
  enabled: true
  nutrition: 50
  fullness: 50

# Replace {} with named rules. Copy the server-side material and model from the actual item.
# All custom foods need Minecraft's consumable component; these rules do not add it.
# Nexo items can use their actual server-side item_model value here. For CraftEngine,
# prefer the item ID under foods, even when the model is sent only to the client.
# Priority: CraftEngine ID, both model selectors, item-model only, custom-model-data only,
# vanilla material, then fallback. At equal model priority, the first rule wins.
# A number matches floats[0]. For lists, each listed field must match in full and in order.
# These examples are disabled until copied into custom-foods:
#   berry_bun:
#     material: minecraft:paper
#     item-model: nexo:berry_bun
#     nutrition: 260
#     fullness: 430
#   model_bread:
#     material: minecraft:bread
#     custom-model-data: 12345
#     nutrition: 350
#     fullness: 500
#   herb_roll:
#     material: minecraft:bread
#     custom-model-data:
#       floats: [12.5]
#       strings: ["pack:herb_roll"]
#       flags: [true]
#       colors: ["#66CC88"]
#     nutrition: 320
#     fullness: 420
custom-foods: {}

foods:
  # CraftEngine item example (the item ID, independent of material or model):
  default:hami_melon_slice:
    fullness: 150
    nutrition: 250
    post-consume:
      effects:
        - type: minecraft:regeneration
          duration: 100
          amplifier: 0
          particles: true
          icon: true
      commands:
        - "tell {player} 你吃下了哈密瓜片"
        - sender: player
          command: "help"

