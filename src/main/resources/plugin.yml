name: HungerOverhaul
version: '${version}'
main: basementhost.randomchad.HungerOverhaul
api-version: '26.3'
description: Replaces Minecraft's vanilla hunger mechanics with fullness and nutrition systems
author: Random_Chad
softdepend: [PlaceholderAPI]
commands:
  hunger:
    description: Shows HungerOverhaul information, player status, changes player data, or reloads settings
    aliases: [ho, nutrition]
    usage: "/hunger [status [player] [compact|detail]|audit <player> [page]|reload|set|add|reduce|freeze|unfreeze]"
    permission: hungeroverhaul.use
permissions:
  hungeroverhaul.use:
    description: Allows using the basic HungerOverhaul command
    default: true
  hungeroverhaul.reload:
    description: Allows reloading HungerOverhaul settings
    default: op
  hungeroverhaul.status.others:
    description: Allows viewing another player's HungerOverhaul status
    default: op
  hungeroverhaul.admin:
    description: Allows changing player HungerOverhaul values and freeze states
    default: op
  hungeroverhaul.audit:
    description: Allows viewing read-only HungerOverhaul admin audit records
    default: op
