plugin:
  enabled: "<green>HungerOverhaul 已启用。</green>"
  disabled: "<yellow>HungerOverhaul 已停用。</yellow>"

command:
  info:
    header: "<gold><bold>{name}</bold></gold>"
    version: "<gray>版本：<white>{version}</white></gray>"
    author: "<gray>作者：<white>{author}</white></gray>"
    language: "<gray>语言：<white>{language}</white></gray>"
    status: "<gray>状态：<green>已启用</green></gray>"
    status-hint: "<gray>查看你的饥饿状态：<white>/{label} status</white></gray>"
    reload-hint: "<gray>重新加载设置：<white>/{label} reload</white></gray>"
  reload-success: "<green>配置文件和语言文件已重新加载。</green>"
  reload-validation-failure: "<red>配置校验失败，继续使用原有设置。{reason}</red>"
  reload-activation-failure: "<red>配置已通过校验，但启用时发生错误。请查看服务器控制台。{reason}</red>"
  no-permission: "<red>你没有使用此命令的权限。</red>"
  usage: "<yellow>用法：/{label} [status|reload|set|add|reduce|freeze|unfreeze]</yellow>"
  status:
    header: "<gold><bold>{player} 的饥饿状态</bold></gold>"
    usage: "<yellow>用法：/{label} status [compact|detail] 或 /{label} status 玩家 [compact|detail]</yellow>"
    loading: "<yellow>你的 HungerOverhaul 数据仍在加载，请稍后重试。</yellow>"
    unavailable: "<red>你的 HungerOverhaul 数据目前不可用。</red>"
    player-only: "<red>只有玩家可以查看自己的饥饿状态。</red>"
    no-permission-others: "<red>你没有查看其他玩家饥饿状态的权限。</red>"
    player-not-found: "<red>找不到曾加入过服务器的玩家“{player}”。</red>"
    other-loading: "<yellow>{player} 的 HungerOverhaul 数据仍在加载，请稍后重试。</yellow>"
    other-unavailable: "<red>{player} 的 HungerOverhaul 数据目前不可用。</red>"
    offline-loading: "<yellow>正在异步读取 {player} 的离线档案……</yellow>"
    offline-data-not-found: "<red>找到了玩家 {player}，但不存在其 HungerOverhaul 数据文件。</red>"
    offline-data-corrupt: "<red>{player} 的离线数据文件已损坏；本次只读查询未修改该文件。</red>"
    offline-query-failed: "<red>无法读取 {player} 的离线数据；本次查询未修改任何玩家文件，请检查服务器控制台。</red>"
    offline-default-fallback: "<yellow>这是旧版 v1 档案，没有保存群组和最大值；本次暂按 default fallback 显示，玩家下次正常保存后会升级。</yellow>"
    offline-group-snapshot: "<gray>群组和最大值来自该玩家最后一次保存的档案。</gray>"
    offline-group-missing-fallback: "<yellow>已保存的群组 {group} 当前不存在；基础数值仍使用保存的最大值，群组规则推算改用 default fallback。</yellow>"
    offline-last-seen: "<gray>档案记录时间：<white>{timestamp}</white></gray>"
    offline-detail-note: "<yellow>以下区间效果和回血数据根据离线档案及当前群组规则推算，并非正在生效的实时属性。</yellow>"
    offline-eating-unavailable: "<gray>进食、消化冷却和提示静默：<yellow>玩家离线，实时状态不可用</yellow></gray>"
    group: "<gray>群组：<white>{group}</white></gray>"
    nutrition: "<gray>营养值：<white>{current}/{maximum}</white> <dark_gray>({percentage}%)</dark_gray></gray>"
    fullness: "<gray>饱腹值：<white>{current}/{maximum}</white> <dark_gray>({percentage}%)</dark_gray></gray>"
    nutrition-frozen: "<gray>营养值：<aqua>已冻结</aqua></gray>"
    nutrition-active: "<gray>营养值：<green>正常变化</green></gray>"
    fullness-frozen: "<gray>饱腹值：<aqua>已冻结</aqua></gray>"
    fullness-active: "<gray>饱腹值：<green>正常变化</green></gray>"
    nutrition-effect: "<gray>营养区间：<white>{status}</white> <dark_gray>({minimum}%–{maximum}%)</dark_gray></gray>"
    fullness-effect: "<gray>饱腹区间：<white>{status}</white> <dark_gray>({minimum}%–{maximum}%)</dark_gray></gray>"
    decay-multipliers: "<gray>区间衰减倍率：营养 <white>×{nutrition}</white>，饱腹 <white>×{fullness}</white></gray>"
    attribute-modifiers: "<gray>综合属性变化：移动 <white>{movement}</white>，挖掘 <white>{mining}</white>，攻击 <white>{attack}</white></gray>"
    effects-disabled: "<gray>数值区间效果：<yellow>已在 status-effects.yml 中关闭</yellow></gray>"
    health-regeneration: "<gray>自定义回血：每 <white>{interval}</white> ticks 基础回复 <white>{base} HP</white>，当前最多回复 <white>{adjusted} HP</white> <dark_gray>(×{multiplier})</dark_gray></gray>"
    health-regeneration-cost: "<gray>回血费用：营养 <white>{nutrition}</white>，饱腹 <white>{fullness}</white>；实际回血低于 <white>{threshold} HP</white> 时免费</gray>"
    health-regeneration-disabled: "<gray>自定义回血：<yellow>已在 config.yml 中关闭</yellow></gray>"
    eating-header: "<gold><bold>进食与消化</bold></gold>"
    eating-idle: "<gray>进食状态：<green>空闲</green></gray>"
    eating-starting: "<gray>进食状态：正在开始食用 <white>{food}</white></gray>"
    eating-active: "<gray>进食状态：<white>{food}</white>，进度 <white>{percentage}%</white>，剩余 <white>{ticks} ticks</white>（{seconds} 秒）</gray>"
    digestion-active: "<gray>消化冷却：剩余 <white>{ticks} ticks</white>（{seconds} 秒）</gray>"
    digestion-ready: "<gray>消化冷却：<green>可以进食</green></gray>"
    blocked-message-silence-active: "<gray>阻止提示静默：剩余 <white>{ticks} ticks</white>（{seconds} 秒）</gray>"
    blocked-message-silence-inactive: "<gray>阻止提示静默：<green>未启用</green></gray>"
    lifecycle-header: "<gold><bold>玩家生命周期规则</bold></gold>"
    lifecycle-death: "<gray>死亡：取消进食 <white>{cancel}</white>，冷却 <white>{cooldown}</white>，保存 <white>{save}</white></gray>"
    lifecycle-respawn: "<gray>重生：营养 <white>{nutrition}</white>，饱腹 <white>{fullness}</white>，冻结值 <white>{frozen}</white>，保存 <white>{save}</white></gray>"
    lifecycle-world-change: "<gray>切换世界：取消进食 <white>{cancel}</white>，冷却 <white>{cooldown}</white>，刷新群组 <white>{refresh}</white>，保存 <white>{save}</white></gray>"
    lifecycle-world-values: "<gray>世界数值：营养 <white>{nutrition}</white>，饱腹 <white>{fullness}</white>，冻结值 <white>{frozen}</white></gray>"
    lifecycle-mode:
      keep: "保持原数值"
      minimum-percentage: "最低 {percentage}%"
      set-percentage: "设置为 {percentage}%"
      group-initial: "群组初始值"
      preserve-percentage: "保持原百分比"
    term:
      yes: "是"
      no: "否"
      preserve: "保留"
      clear: "清除"
      affected: "会被修改"
      protected: "保持不变"
  admin:
    player-not-found: "<red>找不到玩家“{player}”的 HungerOverhaul 数据。</red>"
    loading: "<yellow>{player} 的 HungerOverhaul 数据仍在加载，请稍后重试。</yellow>"
    unavailable: "<red>{player} 的 HungerOverhaul 数据目前不可用。</red>"
    offline-loading: "<yellow>正在异步读取并准备修改 {player} 的离线数据……</yellow>"
    offline-data-not-found: "<red>找到了玩家 {player}，但不存在其 HungerOverhaul 数据文件；未创建新文件。</red>"
    offline-data-corrupt: "<red>{player} 的离线数据文件已损坏；本次修改没有覆盖该文件。</red>"
    offline-read-failure: "<red>无法读取 {player} 的离线数据，本次修改未执行；请检查服务器控制台。</red>"
    offline-save-failure: "<red>无法确认 {player} 的离线数据已保存，请检查服务器控制台。</red>"
    offline-cache-save-failure: "<red>{player} 的内存数据已修改，但写入文件失败。请先检查控制台和玩家状态，再决定是否重试。</red>"
    invalid-number: "<red>“{value}”不是有效的有限数值。</red>"
    negative-number: "<red>数值不能为负数。</red>"
    value-usage: "<yellow>用法：/{label} [set|add|reduce] [玩家] [nutrition|fullness|all] [数值]</yellow>"
    freeze-usage: "<yellow>用法：/{label} [freeze|unfreeze] [玩家] [nutrition|fullness|all]</yellow>"
    success: "<green>已更新玩家 {player} 的 HungerOverhaul 数据。</green>"

data:
  corrupt-reset: "<yellow>你的 HungerOverhaul 数据文件已经损坏，现已替换为默认数据。</yellow>"
  load-failure: "<red>无法加载你的 HungerOverhaul 数据，请联系服务器管理员。</red>"

actionbar:
  format: "<gold>营养</gold> <white>{nutrition}/{max_nutrition}</white> <dark_gray>|</dark_gray> <gold>饱腹</gold> <white>{fullness}/{max_fullness}</white>"

warning:
  low-nutrition: "<yellow>你的营养值偏低：<white>{percentage}%</white>（警告阈值：{threshold}%），请尽快选择有营养的食物。</yellow>"
  low-fullness: "<yellow>你的饱腹值偏低：<white>{percentage}%</white>（警告阈值：{threshold}%），请尽快进食。</yellow>"

eating:
  cooldown: "<yellow>你仍在消化食物，请等待 <white>{seconds}</white> 秒后再进食。</yellow>"
  overflow-header: "<red>这份食物超过了你当前可容纳的数值空间。</red>"
  nutrition-overflow: "<gray>营养值：食物提供 <white>{change}</white>，剩余空间 <white>{space}</white>，将溢出 <red>{overflow}</red>。</gray>"
  fullness-overflow: "<gray>饱腹值：食物提供 <white>{change}</white>，剩余空间 <white>{space}</white>，将溢出 <red>{overflow}</red>。</gray>"
  overflow-hint: "<gray>请等待数值降低，或把对应的 overflow-policy 改为 <white>clamp</white>。</gray>"
  feedback:
    progress: "<gold>进食中</gold> <white>{percentage}%</white> <dark_gray>| 剩余 {seconds} 秒</dark_gray>"
    completed: "<green>进食完成</green> <gray>| 营养 <white>{nutrition}</white>，饱腹 <white>{fullness}</white></gray>"
    completed-clamped: "<green>进食完成</green> <gray>| 营养 <white>{nutrition}</white>，饱腹 <white>{fullness}</white>（部分数值已达到上限）</gray>"
    interrupted-damage: "<red>进食已中断：你受到了伤害。</red>"
    interrupted-move: "<red>进食已中断：你移动到了另一个方块。</red>"
    interrupted-sneak-toggle: "<red>进食已中断：你切换了潜行状态。</red>"
    interrupted-item-switch: "<red>进食已中断：你切换了手中的物品。</red>"
    interrupted-released: "<yellow>进食已中断：你停止了使用食物。</yellow>"
    interrupted-reload: "<yellow>配置已重新加载，本次进食已取消，请重新进食。</yellow>"
    interrupted-death: "<red>进食已中断：你已经死亡。</red>"
    interrupted-world-change: "<yellow>进食已中断：你切换了世界。</yellow>"

status-effect:
  fullness:
    extremely-starving: "极度饥饿"
    starving: "饥饿"
    hungry: "空腹"
    normal: "正常"
    satiated: "饱足"
    overfed: "饮食过量"
    overstuffed: "吃撑"
  nutrition:
    severe-deficiency: "重度营养不良"
    deficiency: "营养不良"
    mild-deficiency: "轻度营养不良"
    normal: "正常"
    sufficient: "营养足量"
    abundant: "营养充分"
    excess: "营养过剩"
