plugin:
  enabled: "<green>HungerOverhaul has been enabled.</green>"
  disabled: "<yellow>HungerOverhaul has been disabled.</yellow>"

command:
  info:
    header: "<gold><bold>{name}</bold></gold>"
    version: "<gray>Version: <white>{version}</white></gray>"
    author: "<gray>Author: <white>{author}</white></gray>"
    language: "<gray>Language: <white>{language}</white></gray>"
    status: "<gray>Status: <green>Enabled</green></gray>"
    status-hint: "<gray>View your hunger status: <white>/{label} status</white></gray>"
    reload-hint: "<gray>Reload settings: <white>/{label} reload</white></gray>"
  reload-success: "<green>Configuration and language files have been reloaded.</green>"
  reload-failure: "<red>Could not reload the settings. The previous valid settings are still active. Check the server console.</red>"
  no-permission: "<red>You do not have permission to use this command.</red>"
  usage: "<yellow>Usage: /{label} [status|reload|set|add|reduce|freeze|unfreeze]</yellow>"
  status:
    header: "<gold><bold>Hunger status for {player}</bold></gold>"
    usage: "<yellow>Usage: /{label} status [compact|detail] or /{label} status player [compact|detail]</yellow>"
    loading: "<yellow>Your HungerOverhaul data is still loading. Please try again shortly.</yellow>"
    unavailable: "<red>Your HungerOverhaul data is not currently available.</red>"
    player-only: "<red>Only a player can view their hunger status.</red>"
    no-permission-others: "<red>You do not have permission to view another player's hunger status.</red>"
    player-not-found: "<red>No player named '{player}' who has joined this server was found.</red>"
    other-loading: "<yellow>{player}'s HungerOverhaul data is still loading. Please try again shortly.</yellow>"
    other-unavailable: "<red>{player}'s HungerOverhaul data is not currently available.</red>"
    offline-loading: "<yellow>Reading {player}'s offline data asynchronously...</yellow>"
    offline-data-not-found: "<red>Player {player} was found, but no HungerOverhaul data file exists.</red>"
    offline-data-corrupt: "<red>{player}'s offline data file is corrupt. This read-only query did not change it.</red>"
    offline-query-failed: "<red>Could not read {player}'s offline data. No player file was changed; check the server console.</red>"
    offline-default-fallback: "<yellow>This legacy v1 file does not store a group or maximum values. This view uses the default fallback until the player's next normal save upgrades it.</yellow>"
    offline-group-snapshot: "<gray>The group and maximum values come from the player's last saved snapshot.</gray>"
    offline-group-missing-fallback: "<yellow>Saved group {group} no longer exists. Base values still use the saved maximums, while group-rule estimates use the default fallback.</yellow>"
    offline-last-seen: "<gray>Data recorded at: <white>{timestamp}</white></gray>"
    offline-detail-note: "<yellow>The following range effects and regeneration values are estimates based on the offline file and current group rules, not live attributes.</yellow>"
    offline-eating-unavailable: "<gray>Eating, digestion cooldown, and message silence: <yellow>live state unavailable while offline</yellow></gray>"
    group: "<gray>Group: <white>{group}</white></gray>"
    nutrition: "<gray>Nutrition: <white>{current}/{maximum}</white> <dark_gray>({percentage}%)</dark_gray></gray>"
    fullness: "<gray>Fullness: <white>{current}/{maximum}</white> <dark_gray>({percentage}%)</dark_gray></gray>"
    nutrition-frozen: "<gray>Nutrition: <aqua>Frozen</aqua></gray>"
    nutrition-active: "<gray>Nutrition: <green>Active</green></gray>"
    fullness-frozen: "<gray>Fullness: <aqua>Frozen</aqua></gray>"
    fullness-active: "<gray>Fullness: <green>Active</green></gray>"
    nutrition-effect: "<gray>Nutrition range: <white>{status}</white> <dark_gray>({minimum}%–{maximum}%)</dark_gray></gray>"
    fullness-effect: "<gray>Fullness range: <white>{status}</white> <dark_gray>({minimum}%–{maximum}%)</dark_gray></gray>"
    decay-multipliers: "<gray>Range decay multipliers: nutrition <white>×{nutrition}</white>, fullness <white>×{fullness}</white></gray>"
    attribute-modifiers: "<gray>Combined attributes: movement <white>{movement}</white>, mining <white>{mining}</white>, attack <white>{attack}</white></gray>"
    effects-disabled: "<gray>Value range effects: <yellow>Disabled in status-effects.yml</yellow></gray>"
    health-regeneration: "<gray>Custom regeneration: every <white>{interval}</white> ticks, base <white>{base} HP</white>, current maximum <white>{adjusted} HP</white> <dark_gray>(×{multiplier})</dark_gray></gray>"
    health-regeneration-cost: "<gray>Regeneration cost: nutrition <white>{nutrition}</white>, fullness <white>{fullness}</white>; actual healing below <white>{threshold} HP</white> is free</gray>"
    health-regeneration-disabled: "<gray>Custom regeneration: <yellow>Disabled in config.yml</yellow></gray>"
    eating-header: "<gold><bold>Eating and digestion</bold></gold>"
    eating-idle: "<gray>Eating status: <green>idle</green></gray>"
    eating-starting: "<gray>Eating status: starting to consume <white>{food}</white></gray>"
    eating-active: "<gray>Eating status: <white>{food}</white>, <white>{percentage}%</white> complete, <white>{ticks} ticks</white> ({seconds}s) remaining</gray>"
    digestion-active: "<gray>Digestion cooldown: <white>{ticks} ticks</white> ({seconds}s) remaining</gray>"
    digestion-ready: "<gray>Digestion cooldown: <green>ready to eat</green></gray>"
    blocked-message-silence-active: "<gray>Blocked-message silence: <white>{ticks} ticks</white> ({seconds}s) remaining</gray>"
    blocked-message-silence-inactive: "<gray>Blocked-message silence: <green>inactive</green></gray>"
    lifecycle-header: "<gold><bold>Player lifecycle rules</bold></gold>"
    lifecycle-death: "<gray>Death: cancel eating <white>{cancel}</white>, cooldown <white>{cooldown}</white>, save <white>{save}</white></gray>"
    lifecycle-respawn: "<gray>Respawn: nutrition <white>{nutrition}</white>, fullness <white>{fullness}</white>, frozen values <white>{frozen}</white>, save <white>{save}</white></gray>"
    lifecycle-world-change: "<gray>World change: cancel eating <white>{cancel}</white>, cooldown <white>{cooldown}</white>, refresh group <white>{refresh}</white>, save <white>{save}</white></gray>"
    lifecycle-world-values: "<gray>World values: nutrition <white>{nutrition}</white>, fullness <white>{fullness}</white>, frozen values <white>{frozen}</white></gray>"
    lifecycle-mode:
      keep: "keep current value"
      minimum-percentage: "minimum {percentage}%"
      set-percentage: "set to {percentage}%"
      group-initial: "group initial value"
      preserve-percentage: "preserve percentage"
    term:
      yes: "yes"
      no: "no"
      preserve: "preserve"
      clear: "clear"
      affected: "affected"
      protected: "unchanged"
  admin:
    player-not-found: "<red>No HungerOverhaul data was found for player '{player}'.</red>"
    loading: "<yellow>{player}'s HungerOverhaul data is still loading. Please try again shortly.</yellow>"
    unavailable: "<red>{player}'s HungerOverhaul data is not currently available.</red>"
    offline-loading: "<yellow>Reading and preparing to modify {player}'s offline data asynchronously...</yellow>"
    offline-data-not-found: "<red>Player {player} was found, but no HungerOverhaul data file exists. No file was created.</red>"
    offline-data-corrupt: "<red>{player}'s offline data file is corrupt. This update did not overwrite it.</red>"
    offline-read-failure: "<red>Could not read {player}'s offline data. No update was applied; check the server console.</red>"
    offline-save-failure: "<red>Could not confirm that {player}'s offline data was saved. Check the server console.</red>"
    invalid-number: "<red>'{value}' is not a valid finite number.</red>"
    negative-number: "<red>The value must not be negative.</red>"
    value-usage: "<yellow>Usage: /{label} [set|add|reduce] [player] [nutrition|fullness|all] [value]</yellow>"
    freeze-usage: "<yellow>Usage: /{label} [freeze|unfreeze] [player] [nutrition|fullness|all]</yellow>"
    success: "<green>Updated HungerOverhaul data for {player}.</green>"

data:
  corrupt-reset: "<yellow>Your HungerOverhaul data file was damaged and has been replaced with default data.</yellow>"
  load-failure: "<red>Your HungerOverhaul data could not be loaded. Please contact a server administrator.</red>"

warning:
  low-nutrition: "<yellow>Your nutrition is low: <white>{percentage}%</white> (warning threshold: {threshold}%). Choose nutritious food soon.</yellow>"
  low-fullness: "<yellow>Your fullness is low: <white>{percentage}%</white> (warning threshold: {threshold}%). Eat something soon.</yellow>"

eating:
  cooldown: "<yellow>You are still digesting food. Wait <white>{seconds}</white> seconds before eating again.</yellow>"
  overflow-header: "<red>This food exceeds your currently available value capacity.</red>"
  nutrition-overflow: "<gray>Nutrition: food provides <white>{change}</white>, available space <white>{space}</white>, overflow <red>{overflow}</red>.</gray>"
  fullness-overflow: "<gray>Fullness: food provides <white>{change}</white>, available space <white>{space}</white>, overflow <red>{overflow}</red>.</gray>"
  overflow-hint: "<gray>Wait for the value to decrease, or set the relevant overflow-policy to <white>clamp</white>.</gray>"
  feedback:
    progress: "<gold>Eating</gold> <white>{percentage}%</white> <dark_gray>| {seconds}s remaining</dark_gray>"
    completed: "<green>Finished eating</green> <gray>| nutrition <white>{nutrition}</white>, fullness <white>{fullness}</white></gray>"
    completed-clamped: "<green>Finished eating</green> <gray>| nutrition <white>{nutrition}</white>, fullness <white>{fullness}</white> (some values reached their maximum)</gray>"
    interrupted-damage: "<red>Eating interrupted: you took damage.</red>"
    interrupted-move: "<red>Eating interrupted: you moved into another block.</red>"
    interrupted-sneak-toggle: "<red>Eating interrupted: you changed your sneaking state.</red>"
    interrupted-item-switch: "<red>Eating interrupted: you changed the held item.</red>"
    interrupted-released: "<yellow>Eating interrupted: you stopped using the food.</yellow>"
    interrupted-reload: "<yellow>The configuration was reloaded. This attempt was cancelled; please eat again.</yellow>"
    interrupted-death: "<red>Eating interrupted: you died.</red>"
    interrupted-world-change: "<yellow>Eating interrupted: you changed worlds.</yellow>"

status-effect:
  fullness:
    extremely-starving: "Extremely starving"
    starving: "Starving"
    hungry: "Hungry"
    normal: "Normal"
    satiated: "Satiated"
    overfed: "Overfed"
    overstuffed: "Overstuffed"
  nutrition:
    severe-deficiency: "Severe deficiency"
    deficiency: "Deficiency"
    mild-deficiency: "Mild deficiency"
    normal: "Normal"
    sufficient: "Sufficient"
    abundant: "Abundant"
    excess: "Excess"
